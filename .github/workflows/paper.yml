name: Paper

on:
  push:
    branches: [main]
    paths: ["paper/**", ".github/workflows/paper.yml"]
  pull_request:
    paths: ["paper/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: kokoro.tex
          working_directory: paper
          latexmk_use_xelatex: false
      - name: upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: kokoro-paper
          path: paper/kokoro.pdf
          retention-days: 90
