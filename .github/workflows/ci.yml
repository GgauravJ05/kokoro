name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check --output-format=github .

  headers:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: every source file carries SPDX + copyright
        run: python scripts/check_headers.py

  types:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # `train` is required: without torch, mypy --strict rejects every
      # nn.Module subclass under disallow_subclassing_any.
      - run: pip install -e ".[dev,serve,index,train]"
      - run: mypy

  test:
    name: test ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One macOS run guards against platform-specific numerics without
          # quadrupling CI minutes.
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q --cov-report=xml -m "not network and not gpu"
      - name: upload coverage
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  ann:
    # hnswlib ships no wheel, so pip compiles it with -march=native. The pip
    # cache in the matrix job is keyed on pyproject.toml, so a binary built on
    # an AVX-512 runner gets restored onto a runner without those instructions
    # and dies with "Fatal Python error: Illegal instruction" at import. Build
    # it fresh here, uncached, on the machine that will run it.
    name: ann index (native build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -e ".[dev,index]"
      - name: hnswlib must import before it can be tested
        run: python -c "import hnswlib; print(hnswlib.__file__)"
      - run: pytest -q tests/test_index.py --no-cov

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: [lint, types, test, ann]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: metadata must be valid before it can ever be published
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
