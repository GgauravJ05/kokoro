name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories surface without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze python
    runs-on: ubuntu-latest
    # CodeQL requires GitHub Advanced Security, which a free private repo
    # does not have. Skip rather than fail until the repo goes public.
    if: github.event_name == 'schedule' || github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
